<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy 20th rithu<3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Ambient floating particles -->
<div class="particles" id="particles" aria-hidden="true"></div>

<!-- ============ SEALED ENVELOPE (opening screen) ============ -->
<section id="envelope-screen" class="screen">
  <div class="envelope" id="envelope">
    <div class="envelope-back"></div>
    <div class="envelope-flap"></div>
    <div class="envelope-front"></div>
    <div class="wax-seal" id="waxSeal">
      <span class="wax-seal-initial">&hearts;</span>
    </div>
  </div>
  <p class="envelope-hint">tap the seal to open</p>
</section>

<!-- ============ SLIDESHOW ============ -->
<section id="slideshow-screen" class="screen hidden">

  <div class="slides" id="slides"><!-- slides injected by script.js --></div>

  <!-- Navigation icons -->
  <button class="nav-icon nav-prev" id="prevBtn" aria-label="Previous page">
    <svg viewBox="0 0 24 24"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button class="nav-icon nav-next" id="nextBtn" aria-label="Next page">
    <svg viewBox="0 0 24 24"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <!-- Progress dots -->
  <div class="dots" id="dots"></div>

  <!-- Music toggle -->
  <button class="music-toggle" id="musicToggle" aria-label="Toggle music">
    <svg class="icon-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="18" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
  </button>

</section>

<audio id="bgMusic" loop preload="auto">
  <source src="assets/audio/song.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>
</body>
</html>
